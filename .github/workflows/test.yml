name: Test Action Template

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and Test Action
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v7

      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Run TypeScript compilation check (typecheck)
      - name: Run Typecheck
        run: npx tsc --noEmit

      # 4.5. Run Lint (Biome)
      - name: Run Lint
        run: npm run lint

      # 5. Run Unit Tests
      - name: Run Tests
        run: npm run test

      # 5.5. Run Coverage (85% gate)
      - name: Run Coverage
        run: npm run coverage

      # 6. Run Build Bundle
      - name: Build Bundle
        run: npm run build

      # 6.5. Verify committed bundle matches source code
      - name: Verify Bundle Up-To-Date
        run: |
          git diff --exit-code dist/index.js

      # NOTE: No live "uses: ./" integration test here. This action mutates git
      # tag refs (moves a floating major tag), so invoking it on every PR would
      # rewrite refs — unsafe as a per-PR check. Its behavior is fully exercised
      # by the unit tests above (octokit mocked, 100% coverage) per testing_standards.
