name: Test Action Template

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and Test Action
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v6

      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Run TypeScript compilation check (typecheck)
      - name: Run Typecheck
        run: npx tsc --noEmit

      # 4.5. Run Lint (Biome)
      - name: Run Lint
        run: npm run lint

      # 5. Run Unit Tests
      - name: Run Tests
        run: npm run test

      # 5.5. Run Coverage (85% gate)
      - name: Run Coverage
        run: npm run coverage

      # 6. Run Build Bundle
      - name: Build Bundle
        run: npm run build

      # 6.5. Verify committed bundle matches source code
      - name: Verify Bundle Up-To-Date
        run: |
          git diff --exit-code dist/index.js

      # 7. Local Integration Test (Verify execution of compiled action)
      - name: Run Local Integration Test
        id: integration
        uses: ./
        with:
          who-to-greet: 'GitHub Actions Integration'

      # 8. Assert Action Output
      - name: Assert Action Output
        run: |
          if [ "${{ steps.integration.outputs.greeting }}" != "Hello, GitHub Actions Integration!" ]; then
            echo "Unexpected greeting output: '${{ steps.integration.outputs.greeting }}'"
            exit 1
          fi
